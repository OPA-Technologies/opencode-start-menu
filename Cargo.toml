[package]
name = "opencode-start-menu"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
anyhow = "1.0"
tokio = { version = "1.40", features = ["process", "macros"] }
which = "5.0"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
shellexpand = "3.0"
fs2 = "0.4"
